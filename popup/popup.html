<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusTube</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-card">
    <header class="popup-header">
      <div class="brand">
        <span class="logo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </span>
        <div class="brand-title">
          <h2>FocusTube</h2>
          <span class="version">v1.0</span>
        </div>
      </div>
      <span class="badge active">Focus Mode</span>
    </header>

    <section class="bento-tile bento-lavender">
      <div class="bento-tile-head">
        <h3>Study Library</h3>
        <p>Browse timestamped notes, slides, and links.</p>
      </div>
      <button id="open-dashboard-btn" class="btn btn-primary w-full">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        Open Study Library
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
      </button>
    </section>

    <section class="bento-tile bento-pink">
      <div class="bento-tile-head">
        <h3>Shorts Guard</h3>
        <span id="shorts-count-text" class="quota-count">0 / 5</span>
      </div>
      <div class="bento-float-white">
        <div class="progress-bar-bg">
          <div id="shorts-progress-bar" class="progress-bar-fill" style="width: 0%;"></div>
        </div>
        <div class="limit-row">
          <label for="shorts-limit-input">Daily limit</label>
          <div class="stepper">
            <button id="limit-dec-btn" class="stepper-btn">-</button>
            <input type="number" id="shorts-limit-input" value="5" min="0" max="50" />
            <button id="limit-inc-btn" class="stepper-btn">+</button>
          </div>
        </div>
      </div>
    </section>

    <section class="bento-tile bento-green">
      <div class="bento-tile-head">
        <h3>Library</h3>
        <span class="storage-pill">Local</span>
      </div>
      <div class="bento-float-dark stats-row">
        <div class="stat-box">
          <span class="stat-number" id="popup-stat-lectures">0</span>
          <span class="stat-caption">Lectures</span>
        </div>
        <div class="stat-box">
          <span class="stat-number" id="popup-stat-notes">0</span>
          <span class="stat-caption">Notes</span>
        </div>
        <div class="stat-box">
          <span class="stat-number" id="popup-stat-slides">0</span>
          <span class="stat-caption">Slides</span>
        </div>
      </div>
    </section>

    <section class="bento-tile bento-yellow">
      <div class="bento-tile-head">
        <h3>Shortcuts</h3>
      </div>
      <div class="bento-float-white shortcuts-card">
        <div class="shortcut-item">
          <span><kbd>Alt</kbd> + <kbd>N</kbd></span>
          <span>Current Timestamp</span>
        </div>
        <div class="shortcut-item">
          <span><kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>N</kbd></span>
          <span>Rewind 5s</span>
        </div>
        <div class="shortcut-item">
          <span><kbd>Alt</kbd> + <kbd>S</kbd></span>
          <span>Snap Video Slide</span>
        </div>
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
